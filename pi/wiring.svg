<rect class="box" x="40" y="428" width="92" height="40" rx="8"/><text x="86" y="446" text-anchor="middle" class="t">Wall outlet</text><text x="86" y="460" text-anchor="middle" class="ts">120 V</text>
<rect class="box" x="176" y="428" width="138" height="44" rx="8"/><text x="245" y="446" text-anchor="middle" class="t">Fused C14 inlet</text><text x="245" y="461" text-anchor="middle" class="ts">switch · fuse · SL22 NTC</text>
<rect class="box" x="360" y="428" width="116" height="44" rx="8"/><text x="418" y="446" text-anchor="middle" class="t">LRS-350-5</text><text x="418" y="461" text-anchor="middle" class="ts">5 V / 60 A</text>
<path d="M132 448 L176 448" fill="none" stroke="#D85A30" stroke-width="2.5" marker-end="url(#am)"/>
<path d="M314 448 L360 448" fill="none" stroke="#D85A30" stroke-width="2.5" marker-end="url(#am)"/>

<rect class="box" x="176" y="524" width="300" height="96" rx="8"/><text x="326" y="548" text-anchor="middle" class="t">Backplane rev A (your PCB)</text><text x="326" y="566" text-anchor="middle" class="ts">Pi 5 socketed on 2×20</text><text x="326" y="582" text-anchor="middle" class="ts">9× ATO-fused 5 V drops · buffers</text><text x="326" y="600" text-anchor="middle" class="ts">alt: bus bars + 10 fuse holders</text>
