<rect class="box" x="536" y="524" width="32" height="32" rx="4"/><rect class="box" x="574" y="524" width="32" height="32" rx="4"/><rect class="box" x="612" y="524" width="32" height="32" rx="4"/>
<rect class="box" x="536" y="562" width="32" height="32" rx="4"/><rect class="box" x="574" y="562" width="32" height="32" rx="4"/><rect class="box" x="612" y="562" width="32" height="32" rx="4"/>
<rect class="box" x="536" y="600" width="32" height="32" rx="4"/><rect class="box" x="574" y="600" width="32" height="32" rx="4"/><rect class="box" x="612" y="600" width="32" height="32" rx="4"/>
<text x="590" y="650" text-anchor="middle" class="ts">9× P2.5 panels (+1 spare)</text>
