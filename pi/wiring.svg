<svg width="680" height="918" viewBox="0 0 680 918" role="img" xmlns="http://www.w3.org/2000/svg">
<title>Album-Art Matrix wiring map</title>
<desc>How every part connects: S1 first-light with one panel and the bonnet, the bench white-balance rig, and the nine-panel wall on the custom backplane.</desc>
<style>
  .t  { font: 600 12.5px -apple-system, 'Helvetica Neue', Arial, sans-serif; fill: #2C2C2A; }
