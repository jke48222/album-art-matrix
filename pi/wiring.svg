<rect class="box" x="530" y="756" width="120" height="40" rx="8"/><text x="590" y="774" text-anchor="middle" class="t">French cleat</text><text x="590" y="788" text-anchor="middle" class="ts">behind, on wall</text>
<path d="M590 756 L590 732" fill="none" stroke="#888780" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#ag)"/>

<text x="40" y="742" class="ts">JP1 on the backplane can power the Pi from the wall supply</text>
<text x="40" y="760" class="ts">(deletes the USB-C PSU). Star ground lives on the board.</text>

<text x="40" y="836" class="th">NO WIRING — BENCH TOOLS</text>
<text x="40" y="858" class="ts">Soldering iron + solder (TCS header, THT board parts) · multimeter (verify 5 V before</text>
<text x="40" y="874" class="ts">first power-on) · crimper + terminals (trunk lugs) · strippers · drivers · heat-shrink · M3 kit</text>
</svg>
