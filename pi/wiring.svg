  .th { font: 700 13.5px -apple-system, 'Helvetica Neue', Arial, sans-serif; fill: #2C2C2A; letter-spacing: 0.4px; }
  .box { fill: #F1EFE8; stroke: #B4B2A9; stroke-width: 1; }
</style>
<rect x="0" y="0" width="680" height="918" fill="#FBFAF6"/>
