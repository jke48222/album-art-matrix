<text x="40" y="86" class="th">S1 — FIRST LIGHT · one panel + bonnet</text>

<rect class="box" x="40" y="120" width="92" height="40" rx="8"/><text x="86" y="138" text-anchor="middle" class="t">Wall outlet</text><text x="86" y="152" text-anchor="middle" class="ts">120 V</text>
<rect class="box" x="176" y="100" width="112" height="40" rx="8"/><text x="232" y="118" text-anchor="middle" class="t">27 W USB-C PSU</text><text x="232" y="132" text-anchor="middle" class="ts">or owned charger</text>
<rect class="box" x="176" y="164" width="112" height="44" rx="8"/><text x="232" y="182" text-anchor="middle" class="t">LRS-50-5</text><text x="232" y="197" text-anchor="middle" class="ts">5 V / 10 A</text>
<rect class="box" x="336" y="96" width="130" height="56" rx="8"/><text x="401" y="118" text-anchor="middle" class="t">Raspberry Pi 5</text><text x="401" y="134" text-anchor="middle" class="ts">microSD · Active Cooler</text>
<rect class="box" x="336" y="184" width="130" height="40" rx="8"/><text x="401" y="202" text-anchor="middle" class="t">Triple Bonnet</text><text x="401" y="216" text-anchor="middle" class="ts">on riser header</text>
