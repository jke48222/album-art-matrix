<line x1="150" y1="46" x2="180" y2="46" stroke="#7F77DD" stroke-width="2.5"/><text x="186" y="50" class="ts">5 V power</text>
<line x1="262" y1="46" x2="292" y2="46" stroke="#1D9E75" stroke-width="2.5"/><text x="298" y="50" class="ts">data / I2C / USB</text>
