<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Doto:wght@700;900&family=Instrument+Serif:ital@0;1&display=swap">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #080609; font-family: -apple-system, system-ui, sans-serif; }
    a { color: #FFA24D; } a:hover { color: #FFB878; }
  </style>
</helmet>
<div style="position: relative; width: 430px; height: 932px; overflow: hidden; background: #080609">

  <div style="position: absolute; top: 0; left: 0; width: 430px; height: 932px; background-image: linear-gradient(to right, rgba(255,255,255,0.022) 1px, transparent 1px), linear-gradient(to bottom, rgba(255,255,255,0.022) 1px, transparent 1px); background-size: 4px 4px"></div>
  <div style="position: absolute; top: 0; left: 0; width: 430px; height: 932px; background-image: url(./grain.png); opacity: 0.45"></div>

  <div style="position: absolute; top: 62px; left: 26px; width: 378px; display: flex; align-items: center; gap: 8px">
    <div style="font-family: 'Doto', monospace; font-weight: 900; font-size: 14px; letter-spacing: 3px; color: rgba(244,241,236,0.55)">ALBUMWALL</div>
    <div style="width: 5px; height: 5px; border-radius: 50%; background: rgba(255,162,77,0.5)"></div>
    <div style="flex-grow: 1"></div>
    <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="rgba(244,241,236,0.55)" stroke-width="1.6" stroke-linecap="round">
      <line x1="4" y1="6.5" x2="12" y2="6.5"></line><circle cx="16" cy="6.5" r="2.1"></circle>
      <line x1="4" y1="12" x2="6" y2="12"></line><circle cx="9.6" cy="12" r="2.1"></circle><line x1="13.2" y1="12" x2="20" y2="12"></line>
      <line x1="4" y1="17.5" x2="12" y2="17.5"></line><circle cx="16" cy="17.5" r="2.1"></circle>
    </svg>
  </div>

  <div style="position: absolute; top: 356px; left: 28px; width: 374px; display: flex; flex-direction: column; gap: 18px">
    <div style="width: 8px; height: 8px; border-radius: 50%; background: #FFA24D; box-shadow: 0 0 26px 7px rgba(255,162,77,0.45), 0 0 6px 1px rgba(255,196,107,0.9)"></div>
    <div style="font-family: 'Instrument Serif', serif; font-size: 48px; line-height: 1; color: rgba(244,241,236,0.92)">Asleep.</div>
    <div style="font-size: 16px; line-height: 1.55; color: rgba(244,241,236,0.45); max-width: 300px">The wall is dark. The link is alive. Your music keeps playing right here.</div>
  </div>

  <div style="position: absolute; left: 0; bottom: 0; width: 430px; display: flex; flex-direction: column; gap: 18px; background: rgba(11,9,13,0.86); backdrop-filter: blur(30px); border-top: 1px solid rgba(255,255,255,0.06); border-radius: 24px 24px 0 0; padding: 20px 26px 30px 26px">
    <sc-if value="{{ true }}" hint-placeholder-val="{{ true }}">
      <div style="display: flex">
        <sc-for list="{{ modes }}" as="item" hint-placeholder-count="4">
          <div style="flex: 1; display: flex; flex-direction: column; align-items: center; gap: 8px; cursor: pointer; padding: 2px 0" onClick="{{ item.pick }}">
            <div style="{{ item.dotStyle }}"></div>
            <div style="font-family: 'Doto', monospace; font-weight: 700; font-size: 12px; letter-spacing: 2.5px; color: {{ item.labelColor }}">{{ item.label }}</div>
          </div>
        </sc-for>
      </div>
    </sc-if>
    <div style="display: flex; align-items: center; justify-content: center; height: 43px">
      <div style="font-family: 'Doto', monospace; font-weight: 700; font-size: 10px; letter-spacing: 3px; color: rgba(244,241,236,0.28)">PANELS OFF</div>
    </div>
    <div style="display: flex; align-items: center; justify-content: center; gap: 7px">
      <div style="width: 5px; height: 5px; border-radius: 50%; background: #63DE8A"></div>
      <div style="font-size: 12px; color: rgba(244,241,236,0.55)">This iPhone → Wall</div>
      <div style="font-family: 'Doto', monospace; font-weight: 700; font-size: 11px; color: rgba(244,241,236,0.35)">0:02</div>
    </div>
  </div>

</div>
</x-dc>
<script data-dc-script data-props='{"$preview": {"width": 430, "height": 932}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { mode: 'off' };
  }
  renderVals() {
    const modes = [
      { id: 'art', label: 'ART' }, { id: 'cd', label: 'SPIN' },
      { id: 'ambient', label: 'AMBIENT' }, { id: 'off', label: 'OFF' }
    ].map((m) => {
      const sel = m.id === this.state.mode;
      return {
        ...m,
        pick: () => this.setState({ mode: m.id }),
        dotStyle: 'width: 7px; height: 7px; border-radius: 50%; ' + (sel
          ? 'background: rgba(244,241,236,0.9); box-shadow: 0 0 9px 2px rgba(244,241,236,0.4);'
          : 'background: rgba(255,255,255,0.12);'),
        labelColor: sel ? 'rgba(244,241,236,0.9)' : 'rgba(244,241,236,0.32)'
      };
    });
    return { modes };
  }
}
</script>
</body>
</html>
