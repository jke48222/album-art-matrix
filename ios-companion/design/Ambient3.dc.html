<body>

</helmet>
<div style="position: relative; width: 430px; height: 932px; overflow: hidden; background: #F4F1EA; color: #16130F">

  <div style="position: absolute; top: 58px; left: 28px; width: 374px; display: flex; align-items: center; gap: 10px">

    <div style="flex-grow: 1"></div>
    <div style="font-family: 'IBM Plex Mono', monospace; font-size: 10px; letter-spacing: 1px; color: rgba(22,19,15,0.55)">LINK OK</div>
    <div style="width: 6px; height: 6px; border-radius: 50%; background: #16130F"></div>
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#16130F" stroke-width="1.7" stroke-linecap="round" style="margin-left: 4px">
      <line x1="4" y1="6.5" x2="12" y2="6.5"></line><circle cx="16" cy="6.5" r="2.1"></circle>
      <line x1="4" y1="12" x2="6" y2="12"></line><circle cx="9.6" cy="12" r="2.1"></circle><line x1="13.2" y1="12" x2="20" y2="12"></line>
      <line x1="4" y1="17.5" x2="12" y2="17.5"></line><circle cx="16" cy="17.5" r="2.1"></circle>
    </svg>
  </div>

  <div style="position: absolute; top: 108px; left: 48px; display: flex; flex-direction: column; gap: 10px">
    <div style="width: 334px; border: 1px solid rgba(22,19,15,0.22); padding: 6px; background: #F4F1EA">
      <div style="position: relative; width: 320px; height: 320px; background: #0A0A0A">
        <div style="width: 320px; height: 320px; background: linear-gradient(160deg, #E8631A 0%, #A03A20 50%, #441216 100%)"></div>
        <div style="position: absolute; top: 0; left: 0; width: 320px; height: 320px; background-image: linear-gradient(to right, rgba(0,0,0,0.45) 1px, transparent 1px), linear-gradient(to bottom, rgba(0,0,0,0.45) 1px, transparent 1px); background-size: 5px 5px"></div>
      </div>
    </div>
    <div style="width: 334px; display: flex; align-items: center">
      <div style="font-family: 'IBM Plex Mono', monospace; font-size: 10px; letter-spacing: 1px; color: rgba(22,19,15,0.45)">ON THE WALL</div>
      <div style="flex-grow: 1"></div>
      <div style="font-family: 'IBM Plex Mono', monospace; font-size: 10px; letter-spacing: 1px; color: rgba(22,19,15,0.45)">64×64 · AMBIENT</div>
    </div>
  </div>

  <div style="position: absolute; top: 508px; left: 28px; width: 374px; display: flex; flex-direction: column; gap: 6px">
    <div style="font-weight: 800; font-size: 30px; letter-spacing: -0.4px; line-height: 1.05">Gradient</div>
    <div style="font-weight: 500; font-size: 16px; color: rgba(22,19,15,0.55)">Two colours, drifting</div>
  </div>

  <sc-if value="{{ true }}" hint-placeholder-val="{{ true }}">
    <div style="position: absolute; top: 588px; left: 28px; width: 374px; height: 46px; display: flex; border: 1px solid #16130F; border-radius: 8px; overflow: hidden">
      <sc-for list="{{ modes }}" as="item" hint-placeholder-count="4">
        <div style="{{ item.cellStyle }}" onClick="{{ item.pick }}">{{ item.label }}</div>
      </sc-for>
    </div>
  </sc-if>

  <sc-if value="{{ true }}" hint-placeholder-val="{{ true }}">
    <div style="position: absolute; top: 652px; left: 28px; width: 374px; height: 40px; display: flex; border: 1px solid rgba(22,19,15,0.35); border-radius: 8px; overflow: hidden">
      <sc-for list="{{ effects }}" as="item" hint-placeholder-count="4">
        <div style="{{ item.cellStyle }}" onClick="{{ item.pick }}">{{ item.label }}</div>
      </sc-for>
    </div>
  </sc-if>

  <div style="position: absolute; top: 716px; left: 28px; width: 374px; display: flex; align-items: center; gap: 12px">
    <div style="font-weight: 700; font-size: 11px; letter-spacing: 1.5px; color: rgba(22,19,15,0.5); width: 74px">COLOURS</div>
    <div style="width: 38px; height: 38px; border-radius: 50%; background: #E8631A; border: 2px solid #16130F"></div>
    <div style="width: 38px; height: 38px; border-radius: 50%; background: #5E1A1E; border: 1px solid rgba(22,19,15,0.25)"></div>
    <div style="width: 1px; height: 24px; background: rgba(22,19,15,0.2)"></div>
    <div style="width: 26px; height: 26px; border-radius: 50%; background: #D9A028"></div>
    <div style="width: 26px; height: 26px; border-radius: 50%; background: #4C6B4F"></div>
    <div style="width: 26px; height: 26px; border-radius: 50%; background: #16130F"></div>
    <div style="flex-grow: 1"></div>
    <div style="width: 30px; height: 30px; border-radius: 50%; border: 1px solid rgba(22,19,15,0.35); display: flex; align-items: center; justify-content: center">
      <svg width="12" height="12" viewBox="0 0 12 12" fill="none" stroke="#16130F" stroke-width="1.5" stroke-linecap="round"><path d="M6 1.5v9 M1.5 6h9"></path></svg>
    </div>
  </div>

  <div style="position: absolute; top: 776px; left: 28px; width: 374px; display: flex; flex-direction: column; gap: 8px">
    <div style="display: flex; align-items: baseline">
      <div style="font-weight: 700; font-size: 11px; letter-spacing: 1.5px; color: rgba(22,19,15,0.5)">MOTION</div>
      <div style="flex-grow: 1"></div>
      <div style="font-weight: 700; font-size: 15px; font-variant-numeric: tabular-nums">1.0×</div>
    </div>
    <div style="position: relative; height: 28px">
      <div style="position: absolute; top: 2px; left: 0; width: 100%; height: 10px; background-image: repeating-linear-gradient(to right, rgba(22,19,15,0.22) 0px, rgba(22,19,15,0.22) 1px, transparent 1px, transparent 18.65px)"></div>
      <div style="position: absolute; top: 18px; left: 0; width: 100%; height: 2px; background: rgba(22,19,15,0.18)"></div>
      <div style="position: absolute; top: 18px; left: 0; width: 31%; height: 2px; background: #16130F"></div>
      <div style="position: absolute; top: 9px; left: calc(31% - 10px); width: 20px; height: 20px; border-radius: 50%; background: #16130F"></div>
    </div>
  </div>

  <div style="position: absolute; top: 852px; left: 28px; width: 374px; display: flex; flex-direction: column; gap: 8px">
    <div style="display: flex; align-items: baseline">
      <div style="font-weight: 700; font-size: 11px; letter-spacing: 1.5px; color: rgba(22,19,15,0.5)">BRIGHTNESS</div>
      <div style="flex-grow: 1"></div>
      <div style="font-weight: 700; font-size: 15px; font-variant-numeric: tabular-nums">82%</div>
    </div>
    <div style="position: relative; height: 28px">
      <div style="position: absolute; top: 2px; left: 0; width: 100%; height: 10px; background-image: repeating-linear-gradient(to right, rgba(22,19,15,0.22) 0px, rgba(22,19,15,0.22) 1px, transparent 1px, transparent 18.65px)"></div>
      <div style="position: absolute; top: 18px; left: 0; width: 100%; height: 2px; background: rgba(22,19,15,0.18)"></div>
      <div style="position: absolute; top: 18px; left: 0; width: 82%; height: 2px; background: #16130F"></div>
      <div style="position: absolute; top: 9px; left: calc(82% - 10px); width: 20px; height: 20px; border-radius: 50%; background: #16130F"></div>
    </div>
  </div>

</div>
</x-dc>
<script data-dc-script data-props='{"$preview": {"width": 430, "height": 932}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { mode: 'ambient', effect: 'gradient' };
  }
  renderVals() {
    const base = 'flex: 1; display: flex; align-items: center; justify-content: center; cursor: pointer; font-weight: 700; font-size: 12px; letter-spacing: 1.5px; ';
    const modes = [
      { id: 'art', label: 'ART' }, { id: 'cd', label: 'SPIN' },
      { id: 'ambient', label: 'AMBIENT' }, { id: 'off', label: 'OFF' }
    ].map((m, i) => {
      const sel = m.id === this.state.mode;
      return {
        ...m,
        pick: () => this.setState({ mode: m.id }),
        cellStyle: base + (i > 0 ? 'border-left: 1px solid #16130F; ' : '') + (sel
          ? 'background: #16130F; color: #F4F1EA;'
          : 'background: transparent; color: rgba(22,19,15,0.7);')
      };
    });
    const effBase = 'flex: 1; display: flex; align-items: center; justify-content: center; cursor: pointer; font-weight: 700; font-size: 11px; letter-spacing: 1px; ';
    const effects = [
      { id: 'solid', label: 'SOLID' }, { id: 'breathe', label: 'BREATHE' },
      { id: 'rainbow', label: 'RAINBOW' }, { id: 'gradient', label: 'GRADIENT' }
    ].map((e, i) => {
      const sel = e.id === this.state.effect;
      return {
        ...e,
        pick: () => this.setState({ effect: e.id }),
        cellStyle: effBase + (i > 0 ? 'border-left: 1px solid rgba(22,19,15,0.35); ' : '') + (sel
          ? 'background: #16130F; color: #F4F1EA;'
          : 'background: transparent; color: rgba(22,19,15,0.6);')
      };
    });
    return { modes, effects };
  }
}
</script>
</body>
</html>
