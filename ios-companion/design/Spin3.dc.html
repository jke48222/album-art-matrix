<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&family=IBM+Plex+Mono:wght@400;500&display=swap">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #F4F1EA; font-family: 'Archivo', -apple-system, sans-serif; }
    a { color: #E03E1A; } a:hover { color: #B33115; }
  </style>
</helmet>
<div style="position: relative; width: 430px; height: 932px; overflow: hidden; background: #F4F1EA; color: #16130F">

  <div style="position: absolute; top: 58px; left: 28px; width: 374px; display: flex; align-items: center; gap: 10px">
    <div style="font-weight: 800; font-size: 15px; letter-spacing: 1.5px; font-stretch: 115%">ALBUMWALL</div>
    <div style="flex-grow: 1"></div>
    <div style="font-family: 'IBM Plex Mono', monospace; font-size: 10px; letter-spacing: 1px; color: rgba(22,19,15,0.55)">LINK OK</div>
    <div style="width: 6px; height: 6px; border-radius: 50%; background: #16130F"></div>
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#16130F" stroke-width="1.7" stroke-linecap="round" style="margin-left: 4px">
      <line x1="4" y1="6.5" x2="12" y2="6.5"></line><circle cx="16" cy="6.5" r="2.1"></circle>
      <line x1="4" y1="12" x2="6" y2="12"></line><circle cx="9.6" cy="12" r="2.1"></circle><line x1="13.2" y1="12" x2="20" y2="12"></line>
      <line x1="4" y1="17.5" x2="12" y2="17.5"></line><circle cx="16" cy="17.5" r="2.1"></circle>
    </svg>
  </div>

  <div style="position: absolute; top: 108px; left: 48px; display: flex; flex-direction: column; gap: 10px">
    <div style="width: 334px; border: 1px solid rgba(22,19,15,0.22); padding: 6px; background: #F4F1EA">
      <div style="position: relative; width: 320px; height: 320px; background: #0A0A0A">
        <div style="position: absolute; top: 28px; left: 28px; width: 264px; height: 264px; border-radius: 50%; overflow: hidden; border: 1px solid rgba(255,255,255,0.1)">
          <img src="sleeve64.png" alt="spinning" style="width: 264px; height: 264px; image-rendering: pixelated; display: block">
        </div>
        <div style="position: absolute; top: 149px; left: 149px; width: 22px; height: 22px; border-radius: 50%; background: #0A0A0A"></div>
        <div style="position: absolute; top: 0; left: 0; width: 320px; height: 320px; background-image: linear-gradient(to right, rgba(0,0,0,0.45) 1px, transparent 1px), linear-gradient(to bottom, rgba(0,0,0,0.45) 1px, transparent 1px); background-size: 5px 5px"></div>
      </div>
    </div>
    <div style="width: 334px; display: flex; align-items: center">
      <div style="font-family: 'IBM Plex Mono', monospace; font-size: 10px; letter-spacing: 1px; color: rgba(22,19,15,0.45)">ON THE WALL</div>
      <div style="flex-grow: 1"></div>
      <div style="font-family: 'IBM Plex Mono', monospace; font-size: 10px; letter-spacing: 1px; color: rgba(22,19,15,0.45)">64×64 · SPINNING</div>
    </div>
  </div>

  <div style="position: absolute; top: 508px; left: 28px; width: 374px; display: flex; flex-direction: column; gap: 6px">
    <div style="font-weight: 800; font-size: 30px; letter-spacing: -0.4px; line-height: 1.05">Warm Static</div>
    <div style="font-weight: 500; font-size: 16px; color: rgba(22,19,15,0.55)">Analog Motel</div>
  </div>

  <sc-if value="{{ true }}" hint-placeholder-val="{{ true }}">
    <div style="position: absolute; top: 600px; left: 28px; width: 374px; height: 46px; display: flex; border: 1px solid #16130F; border-radius: 8px; overflow: hidden">
      <sc-for list="{{ modes }}" as="item" hint-placeholder-count="4">
        <div style="{{ item.cellStyle }}" onClick="{{ item.pick }}">{{ item.label }}</div>
      </sc-for>
    </div>
  </sc-if>

  <div style="position: absolute; top: 678px; left: 28px; width: 374px; display: flex; flex-direction: column; gap: 8px">
    <div style="display: flex; align-items: baseline">
      <div style="font-weight: 700; font-size: 11px; letter-spacing: 1.5px; color: rgba(22,19,15,0.5)">SPEED</div>
      <div style="flex-grow: 1"></div>
      <div style="font-weight: 700; font-size: 15px; font-variant-numeric: tabular-nums">7.5 rpm</div>
    </div>
    <div style="position: relative; height: 32px">
      <div style="position: absolute; top: 4px; left: 0; width: 100%; height: 10px; background-image: repeating-linear-gradient(to right, rgba(22,19,15,0.22) 0px, rgba(22,19,15,0.22) 1px, transparent 1px, transparent 18.65px)"></div>
      <div style="position: absolute; top: 20px; left: 0; width: 100%; height: 2px; background: rgba(22,19,15,0.18)"></div>
      <div style="position: absolute; top: 20px; left: 0; width: 16%; height: 2px; background: #16130F"></div>
      <div style="position: absolute; top: 11px; left: calc(16% - 10px); width: 20px; height: 20px; border-radius: 50%; background: #16130F"></div>
    </div>
    <sc-if value="{{ true }}" hint-placeholder-val="{{ true }}">
      <div style="width: 230px; height: 40px; display: flex; border: 1px solid #16130F; border-radius: 8px; overflow: hidden; margin-top: 4px">
        <sc-for list="{{ presets }}" as="item" hint-placeholder-count="3">
          <div style="{{ item.cellStyle }}" onClick="{{ item.pick }}">{{ item.label }}</div>
        </sc-for>
      </div>
    </sc-if>
  </div>

  <div style="position: absolute; top: 824px; left: 28px; width: 374px; display: flex; flex-direction: column; gap: 8px">
    <div style="display: flex; align-items: baseline">
      <div style="font-weight: 700; font-size: 11px; letter-spacing: 1.5px; color: rgba(22,19,15,0.5)">BRIGHTNESS</div>
      <div style="flex-grow: 1"></div>
      <div style="font-weight: 700; font-size: 15px; font-variant-numeric: tabular-nums">82%</div>
    </div>
    <div style="position: relative; height: 32px">
      <div style="position: absolute; top: 4px; left: 0; width: 100%; height: 10px; background-image: repeating-linear-gradient(to right, rgba(22,19,15,0.22) 0px, rgba(22,19,15,0.22) 1px, transparent 1px, transparent 18.65px)"></div>
      <div style="position: absolute; top: 20px; left: 0; width: 100%; height: 2px; background: rgba(22,19,15,0.18)"></div>
      <div style="position: absolute; top: 20px; left: 0; width: 82%; height: 2px; background: #16130F"></div>
      <div style="position: absolute; top: 11px; left: calc(82% - 10px); width: 20px; height: 20px; border-radius: 50%; background: #16130F"></div>
    </div>
  </div>

  <div style="position: absolute; left: 28px; bottom: 36px; width: 374px; display: flex; align-items: center; border-top: 1px solid rgba(22,19,15,0.18); padding-top: 12px">
    <div style="font-family: 'IBM Plex Mono', monospace; font-size: 10px; letter-spacing: 1px; color: rgba(22,19,15,0.45)">PUSHED FROM THIS IPHONE</div>
    <div style="flex-grow: 1"></div>
    <div style="font-family: 'IBM Plex Mono', monospace; font-size: 10px; letter-spacing: 1px; color: rgba(22,19,15,0.45)">0:02</div>
  </div>

</div>
</x-dc>
<script data-dc-script data-props='{"$preview": {"width": 430, "height": 932}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { mode: 'cd', preset: '7.5' };
  }
  renderVals() {
    const base = 'flex: 1; display: flex; align-items: center; justify-content: center; cursor: pointer; font-weight: 700; font-size: 12px; letter-spacing: 1.5px; ';
    const modes = [
      { id: 'art', label: 'ART' }, { id: 'cd', label: 'SPIN' },
      { id: 'ambient', label: 'AMBIENT' }, { id: 'off', label: 'OFF' }
    ].map((m, i) => {
      const sel = m.id === this.state.mode;
      return {
        ...m,
        pick: () => this.setState({ mode: m.id }),
        cellStyle: base + (i > 0 ? 'border-left: 1px solid #16130F; ' : '') + (sel
          ? 'background: #16130F; color: #F4F1EA;'
          : 'background: transparent; color: rgba(22,19,15,0.7);')
      };
    });
    const presets = ['7.5', '33⅓', '45'].map((label, i) => {
      const sel = label === this.state.preset;
      return {
        label,
        pick: () => this.setState({ preset: label }),
        cellStyle: base + 'font-variant-numeric: tabular-nums; ' + (i > 0 ? 'border-left: 1px solid #16130F; ' : '') + (sel
          ? 'background: #16130F; color: #F4F1EA;'
          : 'background: transparent; color: rgba(22,19,15,0.7);')
      };
    });
    return { modes, presets };
  }
}
</script>
</body>
</html>
