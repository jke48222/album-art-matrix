<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&display=swap">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #0e0d12; font-family: -apple-system, system-ui, sans-serif; }
    a { color: #ffb46b; } a:hover { color: #ffc98f; }
  </style>
</helmet>
<div style="width: 430px; height: 932px; background: #0e0d12; display: flex; flex-direction: column; gap: 22px; padding: 62px 24px 34px 24px; overflow: hidden">

  <div style="display: flex; align-items: center; gap: 12px">
    <div style="font-family: 'Silkscreen', monospace; font-size: 16px; color: #f2f0ea; letter-spacing: 1px">ALBUMWALL</div>
    <div style="flex-grow: 1"></div>
    <div style="display: flex; align-items: center; gap: 7px; background: #151814; border: 1px solid #23301f; border-radius: 999px; padding: 6px 12px">
      <div style="width: 7px; height: 7px; border-radius: 50%; background: #57d97a; box-shadow: 0 0 8px rgba(87,217,122,0.8)"></div>
      <div style="font-family: 'Silkscreen', monospace; font-size: 8px; color: #8fe3a5; letter-spacing: 1px">WALL LIVE</div>
    </div>
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#8a8a96" stroke-width="1.8" stroke-linecap="round">
      <line x1="4" y1="6.5" x2="12" y2="6.5"></line><circle cx="16" cy="6.5" r="2.2"></circle><line x1="19.6" y1="6.5" x2="20" y2="6.5"></line>
      <line x1="4" y1="12" x2="6" y2="12"></line><circle cx="9.6" cy="12" r="2.2"></circle><line x1="13.2" y1="12" x2="20" y2="12"></line>
      <line x1="4" y1="17.5" x2="12" y2="17.5"></line><circle cx="16" cy="17.5" r="2.2"></circle><line x1="19.6" y1="17.5" x2="20" y2="17.5"></line>
    </svg>
  </div>

  <div style="display: flex; flex-direction: column; align-items: center; gap: 16px">
    <div style="background: #17161c; border: 1px solid #26252e; border-radius: 20px; padding: 11px; box-shadow: 0 30px 90px rgba(255,122,77,0.22), 0 4px 18px rgba(0,0,0,0.6)">
      <div style="position: relative; width: 320px; height: 320px; border-radius: 8px; overflow: hidden; background: #000000">
        <img src="cover64.png" alt="now showing" style="width: 320px; height: 320px; image-rendering: pixelated; display: block">
        <div style="position: absolute; top: 0; left: 0; width: 320px; height: 320px; background-image: linear-gradient(to right, rgba(0,0,0,0.5) 1px, transparent 1px), linear-gradient(to bottom, rgba(0,0,0,0.5) 1px, transparent 1px); background-size: 5px 5px"></div>
      </div>
    </div>
    <div style="display: flex; flex-direction: column; align-items: center; gap: 6px">
      <div style="font-family: 'Silkscreen', monospace; font-size: 8px; color: #6f6e7a; letter-spacing: 2px">NOW SHOWING</div>
      <div style="font-size: 16px; font-weight: 600; color: #f2f0ea">Warm Static <span style="color: #8a8a96; font-weight: 400">— Analog Motel</span></div>
    </div>
  </div>

  <sc-if value="{{ true }}" hint-placeholder-val="{{ true }}">
    <div style="display: flex; gap: 10px">
      <sc-for list="{{ modes }}" as="item" hint-placeholder-count="4">
        <div style="{{ item.tileStyle }}" onClick="{{ item.pick }}">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="{{ item.color }}" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="{{ item.icon }}"></path></svg>
          <div style="font-family: 'Silkscreen', monospace; font-size: 8px; letter-spacing: 1px; color: {{ item.color }}">{{ item.label }}</div>
        </div>
      </sc-for>
    </div>
  </sc-if>

  <div style="display: flex; flex-direction: column; gap: 10px">
    <div style="display: flex; align-items: baseline">
      <div style="font-family: 'Silkscreen', monospace; font-size: 8px; color: #6f6e7a; letter-spacing: 2px">BRIGHTNESS</div>
      <div style="flex-grow: 1"></div>
      <div style="font-family: 'Silkscreen', monospace; font-size: 13px; color: {{ accent }}">82%</div>
    </div>
    <div style="display: flex; justify-content: space-between; align-items: center; background: #14131a; border: 1px solid #232230; border-radius: 999px; padding: 13px 15px">
      <sc-for list="{{ dots }}" as="item" hint-placeholder-count="24">
        <div style="{{ item.style }}"></div>
      </sc-for>
    </div>
  </div>

  <div style="flex-grow: 1"></div>

  <div style="display: flex; align-items: center; gap: 13px; background: #131218; border: 1px solid #222130; border-radius: 18px; padding: 15px 16px">
    <div style="display: flex; align-items: center; justify-content: center; width: 40px; height: 40px; border-radius: 12px; background: #1c2418">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#57d97a" stroke-width="2" stroke-linecap="round">
        <line x1="4" y1="10" x2="4" y2="14"></line><line x1="8.5" y1="6" x2="8.5" y2="18"></line><line x1="13" y1="9" x2="13" y2="15"></line><line x1="17.5" y1="4" x2="17.5" y2="20"></line><line x1="21" y1="11" x2="21" y2="13"></line>
      </svg>
    </div>
    <div style="display: flex; flex-direction: column; gap: 3px">
      <div style="font-size: 14px; font-weight: 600; color: #f2f0ea">This iPhone is the DJ</div>
      <div style="font-size: 12px; color: #8a8a96">Pushing · last push 2s ago</div>
    </div>
    <div style="flex-grow: 1"></div>
    <div style="display: flex; flex-direction: column; align-items: flex-end; gap: 4px">
      <div style="position: relative; width: 40px; height: 24px; border-radius: 999px; background: #2f9e57">
        <div style="position: absolute; top: 2px; left: 18px; width: 20px; height: 20px; border-radius: 50%; background: #ffffff"></div>
      </div>
      <div style="font-size: 9px; color: #6f6e7a">background</div>
    </div>
  </div>

</div>
</x-dc>
<script data-dc-script data-props='{"accent": {"editor": "color", "default": "#ffb46b", "section": "Theme"}, "$preview": {"width": 430, "height": 932}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { mode: 'art' };
  }
  rgba(hex, a) {
    const v = parseInt(hex.slice(1), 16);
    return 'rgba(' + ((v >> 16) & 255) + ',' + ((v >> 8) & 255) + ',' + (v & 255) + ',' + a + ')';
  }
  renderVals() {
    const accent = this.props.accent ?? '#ffb46b';
    const icons = {
      art: 'M4 6a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2z M8.5 9a1.5 1.5 0 1 0 0 3 1.5 1.5 0 1 0 0-3 M4.5 17.5l4.5-4.5 3 3 4-4 3.5 3.5',
      cd: 'M12 4a8 8 0 1 0 0 16 8 8 0 1 0 0-16 M12 10.5a1.5 1.5 0 1 0 0 3 1.5 1.5 0 1 0 0-3',
      ambient: 'M3 9c3-3.5 6 3.5 9 0s6-3.5 9 0 M3 16c3-3.5 6 3.5 9 0s6-3.5 9 0',
      off: 'M12 3v8 M7.5 6.2a7.5 7.5 0 1 0 9 0'
    };
    const base = 'flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 7px; height: 76px; border-radius: 18px; cursor: pointer; ';
    const modes = [
      { id: 'art', label: 'ART' }, { id: 'cd', label: 'SPIN' },
      { id: 'ambient', label: 'AMBIENT' }, { id: 'off', label: 'OFF' }
    ].map((m) => {
      const sel = m.id === this.state.mode;
      return {
        ...m,
        icon: icons[m.id],
        pick: () => this.setState({ mode: m.id }),
        color: sel ? accent : '#9a9aa4',
        tileStyle: base + (sel
          ? 'background: ' + this.rgba(accent, 0.13) + '; border: 1px solid ' + accent + '; box-shadow: 0 0 24px ' + this.rgba(accent, 0.22) + ';'
          : 'background: #16161c; border: 1px solid #26262e;')
      };
    });
    const lit = 20;
    const dots = Array.from({ length: 24 }, (_, i) => ({
      style: 'width: 9px; height: 9px; border-radius: 50%; background: ' +
        (i < lit ? (i === lit - 1 ? '#ffffff' : accent) : '#23232a') + ';'
    }));
    return { accent, modes, dots };
  }
}
</script>
</body>
</html>
