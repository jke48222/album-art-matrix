# Copy to config.toml and adjust. Nothing to sign up for: the Apple Music
# adapter reads the Music app plus the MusicKit helper already configured in
# ~/.config/widgetsuite/ (the same stack the Übersicht widgets use).

[panel]
width = 64      # the WHOLE wall in pixels: 64 (one panel), 128 (2x2), 192 (3x3)
height = 64

# [wall] describes how that canvas is made of panels. Leave it out and the
# canvas is one panel, which is what it was through first light.
#
#   [wall]
#   tile = 64     # one panel's pixels
#   cols = 3      # panels across: the CHAIN length off each port
#   rows = 3      # panels down: one PORT each, and the bonnet has three
#
# The library clocks every port together, so each port carries the same
# number of panels. On the Pi the renderer reads the same shape from
# ~/album-art-matrix/wall ("3x3"), and the two must agree.
#
# Two more keys bend the frame to the wall that actually got built, which
# is what stops a mis-cabled panel being a dismantling job:
#
#   order  = "2 1 0 5 4 3 8 7 6"   # tile 0 is top left, reading across.
#                                  # This example is the map for chains that
#                                  # fill right to left.
#   rotate = "0 0 0 180 180 180 0 0 0"   # degrees clockwise, per tile, for a
#                                        # panel mounted upside down so its
#                                        # ribbon could reach.
#
# Light `scripts/panel_qa.py sweep --wall 3x3 --only tilemap` and read the
# numbers off the wall: that picture tells you exactly what to put here.

[whitebalance]
# Applied in LINEAR light before re-encode. HUB75 primaries are green/blue-
# biased; these starting gains are the research's typical values — a GUESS.
# Measure with the Pico 2 W + TCS34725 (scripts/WB-PROCEDURE.md) and update.
# Skipping this step is why almost all LED-matrix art looks cyan.
r = 1.00
g = 0.75
b = 0.55

[pipeline]
unsharp_radius = 1.0
unsharp_percent = 60    # light unsharp after Lanczos; 0 disables

[nowplaying]
# Order of preference, first answer wins. "phone" is what the app posts
# straight to the wall (no Mac). On the Pi, "applemusic" is the account view
# read with the MusicKit credentials deploy.sh copies over. Any adapter left
# out of this list still runs, after these: a service connected from the
# phone always has somewhere to be.
adapters = ["phone", "applemusic", "spotify", "lastfm", "listenbrainz", "ears"]

# Every key and username in the sections below can be set from the phone
# instead (Tessera > Settings > Services). What the phone sets is kept in
# ~/.config/album-art-matrix/services.json on the wall and wins over this
# file, so nobody needs a computer to connect a service.
# The phone's push and the wall's own ears wake the loop the moment they
# have news; this is the pace for everything polled (a Mac, Last.fm,
# ListenBrainz), and those two keep a five-second memory so 2 s costs little.
poll_seconds = 2.0

[applemusic]
# "" = brain runs on this Mac and reads Music/MusicKit directly.
# On the Pi, point at the reporter running on the Mac:
#   endpoint = "http://Jalens-MacBook-Pro.local:8787"
# On the Mac (here or in the reporter), everything else the Mac plays is read
# as well once `brew install media-control` is done: Spotify's app, TIDAL, a
# browser tab on YouTube Music, SoundCloud or Amazon Music. No settings.
endpoint = ""

[spotify]
# Create an app at developer.spotify.com/dashboard. Add BOTH redirect URIs:
#   tessera://spotify               (the phone signs in and hands the wall its tokens)
#   http://127.0.0.1:8888/callback  (signing in from a Mac terminal instead)
# Paste the Client ID here. No secret is needed anywhere (PKCE).
client_id = ""
redirect_port = 8888

[lastfm]
# Spotify, Tidal and Deezer can all report through one Last.fm account.
# Key: last.fm/api/account/create. User: your Last.fm username.
# Spotify: link it at last.fm/settings/applications (no developer app needed).
# Tidal: Settings > Connect to Last.fm (desktop, web, iPhone; not Android).
# Deezer: deezer.com/account/share in a browser (covers the phone too).
api_key = ""
user = ""

[listenbrainz]
# The open ledger. Reading it needs no key, only the username; anything a
# scrobbler can post there (Web Scrobbler in a browser covers YouTube Music,
# SoundCloud, Amazon Music and more) reaches the wall this way.
user = ""

[ears]
wake = false           # also requires [features] wake; local ONNX inference
wake_threshold = 0.5
wake_word = 0          # 0 hey jarvis; 1 custom hey_wall.onnx when installed
speech_model = 0       # 0 tiny; 1 base, hard three-second request deadline
speech_gate = -45      # dB; capture stops after 0.8 s below this, maximum 8 s
# The wall's own microphone, named by Shazam (shazamio: no key, no account,
# and not an offered API, so it can break the day Apple changes it). "auto"
# picks the first USB microphone `arecord -l` lists; name one instead if
# there are several (plughw:2,0 is usual). Everything else about hearing,
# the gate, the clip length, the gain, is a Hearing knob on the phone.
device = "auto"
# Gestures are also editable through Hearing on the phone.
knock = false
teach_by_ear = true     # in-memory twenty-second clips, fingerprints only
teach_match_score = 12  # aligned native Olaf hashes
knock_sensitivity = 20  # rise in dB above the one-second room average
whistle = false

[sink]
type = "preview"                 # "preview" on the Mac, "pi" on the Pi
fifo = "/tmp/album-frame.fifo"   # must match pi/run_renderer.sh
preview_dir = "preview_out"

[animation]
mode = "static"   # "cd" = spinning sleeve (S5 preview); BPM beat-lock lands at S4
rpm = 7.5         # one revolution per four bars at 120 BPM

# Animation frame rate. NOT the panel's refresh rate: the library's 9600 Hz is
# the BCM bit-plane refresh, which builds colour depth by rescanning a row, and
# is a different number from how often new content appears.
#
# 60. The renderer draws the held frame once per scanned frame on its own
# (art_display.c, temporal dithering), so a frame the brain sends is shown
# at the next scan and never torn; this rate only decides how smooth an
# animation is and how much of a Pi core it costs.
fps = 60

[control]
port = 8788     # wall control API (iOS companion posts here)

[homekit]
# The wall in the Home app, and so on Siri, the Watch and in Control Centre:
# a light (on, off, brightness, a colour for the ambient face), a television
# (the faces as inputs, driven by the Control Centre remote), and two sensors
# (sound in the room, music on the wall) for automations. Pairing lives in
# ~/.config/album-art-matrix/homekit.state; delete it to unpair. While
# unpaired the wall draws its setup code on the panel for three minutes at
# boot, and POST /homekit/show draws it again. Needs HAP-python (in
# requirements.txt). Automations and Siri on a HomePod need a home hub.
enabled = false
name = "Wall"       # what Siri calls the light; the rest are "<name> Remote", "<name> Sound", "<name> Music"
port = 51826
# The setup code. Set one: the library keeps keys and pairings across
# restarts but not the code, so without this every restart draws a new one.
# Eight digits as xxx-xx-xxx, nothing obvious (HomeKit refuses 000-00-000,
# 123-45-678 and the like).
pincode = "371-22-984"
log = "info"        # "debug" logs every request the phone makes, for a pairing that will not take

# Each build's abilities are opt-in. The brain watches this table once a
# second without disk reads on the rendering loop. GET /features reports it.
[features]
scrobble = false
knock = false
teach = false
ask = false
wake = false
horizon = false
note = false        # POST /note and the Tell the wall Shortcut
airplay = false
shelf = false
earworm = false
show = false
imagine = false
weather = false
posters = false
games = false

[shelf]
mark = true         # small disc on streamed sleeves also owned on vinyl

[scrobble]
# Only records named by the microphone are ours to report. Streaming apps
# report themselves. Future adapters can be opted in when integrated here.
sources = ["ears"]
# Set listenbrainz.token from Tessera > Services > ListenBrainz, not here.
# Qualified offline listens live in scrobbles.jsonl for at most seven days;
# dedupe receipts and the last listen live in scrobble-state.json.

# Claude credentials are only entered in Tessera > Services > Claude.
# No claude.api_key belongs in this seed. /ask uses claude-opus-5.

[airplay]
# Enabled only by [features] airplay. Native builds: pi/install-airplay.sh.
output = "stdout"       # discarded by the brain; "alsa" for a connected DAC
sample_rate = 44100      # RTP metadata clock, separate from audio output rate
host = "album-matrix.local" # reachable cover-art host for the phone and Pi
